           GLOBAL & RESET STYLES
        ========================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to bottom, #8fd3ff 0%, #3ea7d8 20%, #0b5d8f 50%, #063b63 75%, #021f38 100%);
            position: relative;
            color: #fff;
        }

        /* Overlay */
        .overlay {
            position: fixed;
            inset: 0;
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.08);
            z-index: 1;
            pointer-events: none;
        }

        /* Ambient Glows */
        body::before {
            content: "";
            position: absolute;
            width: 700px;
            height: 700px;
            background: #ffd6e7;
            filter: blur(140px);
            top: -220px;
            left: -200px;
            opacity: 0.5;
            animation: float1 12s infinite alternate;
            z-index: 0;
            pointer-events: none;
        }

        body::after {
            content: "";
            position: absolute;
            width: 600px;
            height: 600px;
            background: #fff0f5;
            filter: blur(120px);
            bottom: -200px;
            right: -200px;
            opacity: 0.4;
            animation: float2 14s infinite alternate;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes float1 {
            from { transform: translateY(0) translateX(0); }
            to { transform: translateY(120px) translateX(100px); }
        }

        @keyframes float2 {
            from { transform: translateY(0); }
            to { transform: translateY(-120px); }
        }

        /* View Section Management */
        .view-section {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.8s ease, visibility 0.8s ease;
            z-index: 20;
            padding: 20px;
        }

        .view-section.active {
            opacity: 1;
            visibility: visible;
        }

        /* ==========================================
           OCEAN BACKGROUND & ANIMATIONS
        ========================================== */
        #ocean-bg {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .surface-light {
            position: absolute;
            top: -350px;
            left: 50%;
            transform: translateX(-50%);
            width: 1400px;
            height: 800px;
            background: radial-gradient(circle, rgba(255,255,255,.35), rgba(255,255,255,.08), transparent 75%);
            filter: blur(60px);
            animation: surfaceLight 10s ease-in-out infinite;
        }

        @keyframes surfaceLight {
            0%, 100% { opacity: .45; transform: translateX(-50%) scale(1); }
            50% { opacity: .8; transform: translateX(-50%) scale(1.08); }
        }

        .ray {
            position: absolute;
            top: -150px;
            width: 180px;
            height: 120%;
            background: linear-gradient(to bottom, rgba(255,255,255,.18), transparent);
            transform: rotate(8deg);
            filter: blur(12px);
            animation: rayMove 12s ease-in-out infinite;
            opacity: .4;
        }

        .ray:nth-child(1) { left: 10%; animation-delay: 0s; }
        .ray:nth-child(2) { left: 32%; animation-delay: 3s; }
        .ray:nth-child(3) { left: 55%; animation-delay: 6s; }
        .ray:nth-child(4) { left: 78%; animation-delay: 9s; }

        @keyframes rayMove {
            0%, 100% { transform: rotate(8deg) translateY(0); }
            50% { transform: rotate(5deg) translateY(40px); }
        }

        .wave {
            position: fixed;
            bottom: 120px;
            left: -50%;
            width: 200%;
            height: 180px;
            background: rgba(255,255,255,.08);
            border-radius: 50%;
            animation: waveMove 10s linear infinite;
            z-index: 8;
            pointer-events: none;
        }

        .wave:nth-child(2) {
            bottom: 90px;
            opacity: .5;
            animation-duration: 14s;
            animation-direction: reverse;
        }

        @keyframes waveMove {
            0% { transform: translateX(0); }
            100% { transform: translateX(50%); }
        }

        .sea-glow {
            position: fixed;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0,255,255,.25), transparent 70%);
            filter: blur(30px);
            animation: glowMove 12s ease-in-out infinite;
            z-index: 2;
            pointer-events: none;
        }

        @keyframes glowMove {
            0%, 100% { transform: translate(0,0); }
            50% { transform: translate(80px,-80px); }
        }

        /* Dynamic Ocean Floor */
        .ocean-floor {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 180px;
            background: linear-gradient(to top, #5d4a2c, #9d8155, transparent);
            z-index: 7;
            overflow: hidden;
            pointer-events: none;
        }

        .seaweed {
            position: absolute;
            bottom: 0;
            width: 12px;
            height: 120px;
            background: #2ecc71;
            border-radius: 20px;
            transform-origin: bottom;
            animation: wave 3s ease-in-out infinite;
        }

        .seaweed1 { left: 8%; height: 120px; }
        .seaweed2 { left: 18%; height: 170px; animation-delay: .5s; }
        .seaweed3 { right: 18%; height: 150px; animation-delay: 1s; }
        .seaweed4 { right: 8%; height: 180px; animation-delay: 1.5s; }

        @keyframes wave {
            0%, 100% { transform: rotate(-6deg); }
            50% { transform: rotate(7deg); }
        }

        .coral {
            position: absolute;
            bottom: 0;
            width: 90px;
            height: 80px;
            border-radius: 45px;
            background: #ff7da7;
            filter: blur(.5px);
        }

        .coral1 { left: 28%; }
        .coral2 { right: 25%; background: #ff9560; }

        .starfish {
            position: absolute;
            bottom: 18px;
            left: 50%;
            font-size: 45px;
            animation: spinStar 10s linear infinite;
        }

        @keyframes spinStar {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .shell {
            position: absolute;
            bottom: 15px;
            right: 15%;
            font-size: 45px;
            animation: shellGlow 2.5s ease-in-out infinite;
        }

        @keyframes shellGlow {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 0px white); }
            50% { transform: scale(1.08); filter: drop-shadow(0 0 15px white); }

           PARTICLES, FISH & ANIMATED ELEMENTS
        ========================================== */
        #bubbles, #hearts, #jellyContainer, #fishContainer {

            pointer-events: none;

        .bubble {
            position: absolute;
            bottom: -100px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.85), rgba(255,255,255,.2));
            border: 1px solid rgba(255,255,255,.3);
            box-shadow: 0 0 12px rgba(255,255,255,.25);
            animation: bubbleFloat linear forwards;
        }

        @keyframes bubbleFloat {
            0% { transform: translateY(0) scale(.2); opacity: 0; }

        .heart {
            position: absolute;

        @keyframes rise {

        .fish {

            left: -150px;

            pointer-events: none;
            opacity: 0.95;

@keyframes fishSwim {
    0% {
        left: -150px;

        transform: translateY(-25px) scaleX(-1);

}

@keyframes fishSwimReverse {

        transform: translateY(-25px);

        left: -150px;

            "Because you are my comfort after every difficult day.",
            "Because you make me believe that miracles exist.",
            "Because you are my favorite person in the world.",
            "Because your smile is the first thing I want to see every morning.",
            "Because your voice feels like home.",
            "Because I want to celebrate every little moment with you.",
            "Because I can imagine my future with you.",
            "Because loving you has become a part of who I am.",
            "Because you are the most beautiful chapter of my life.",
            "Because you are the dream I never want to wake up from.",
            "Because if I had a thousand hearts, every one of them would belong to you.",
            "Because no matter where life takes us, my heart will always find its way back to you.",
            "Because out of all the oceans and all the treasures in this world... my greatest treasure will always be you, Lucile. ❤️"
        ];

        // ------------------------------------------
        // VIEW NAVIGATION & STATE
        // ------------------------------------------
        let currentReason = 0;

        const heroView = document.getElementById("hero-view");
        const reasonsView = document.getElementById("reasons-view");
        const endingView = document.getElementById("ending-view");

        function switchView(fromView, toView) {
            fromView.classList.remove("active");
            setTimeout(() => {
                toView.classList.add("active");
            }, 400);
        }

        // ------------------------------------------
        // AUDIO CONTROLLER
        // ------------------------------------------
        const loveMusic = document.getElementById("loveMusic");
        const oceanSound = document.getElementById("oceanSound");
        const musicBtn = document.getElementById("musicBtn");

        function startAudio() {
            if (oceanSound) {
                oceanSound.volume = 1;
                oceanSound.play().catch(() => console.log("Audio play blocked by browser."));
            }
            if (loveMusic) {
                loveMusic.volume = 1;
                loveMusic.play().catch(() => console.log("Audio play blocked by browser."));
            }
        }

        if (musicBtn) {
            musicBtn.addEventListener("click", () => {
                if (!loveMusic) return;
                if (loveMusic.paused) {
                    loveMusic.play();
                    oceanSound.play();
                    musicBtn.innerHTML = "⏸️ Pause Audio";
                } else {
                    loveMusic.pause();
                    oceanSound.pause();
                    musicBtn.innerHTML = "🎵 Play Audio";
                }
            });
        }

        // ------------------------------------------
        // REASONS SYSTEM & DEPTH LOGIC
        // ------------------------------------------
        const reasonText = document.getElementById("reason");
        const numberText = document.getElementById("number");
        const depthText = document.getElementById("depthText");
        const oceanScene = document.getElementById("oceanScene");
        const nextBtn = document.getElementById("nextBtn");

        function updateOceanDepth() {

    let depthIndex = currentReason + 1;
    let depthMeters = depthIndex * 5;

    if (depthIndex <= 20) {

        document.body.style.background =
        "linear-gradient(to bottom,#8fd3ff,#3ea7d8,#0b5d8f)";

        depthText.innerHTML =
        `Depth: ${depthMeters}m 🌊<br>Near the surface ☀️`;

    }

    else if (depthIndex <= 40) {

        document.body.style.background =
        "linear-gradient(to bottom,#3ea7d8,#056a9b,#033b63)";

        depthText.innerHTML =
        `Depth: ${depthMeters}m 🪸<br>Coral Reef`;

    }

    else if (depthIndex <= 60) {

        document.body.style.background =
        "linear-gradient(to bottom,#04486f,#032c4a,#021d38)";

        depthText.innerHTML =
        `Depth: ${depthMeters}m 🦈<br>Shark Territory`;

    }

    else if (depthIndex <= 80) {

        document.body.style.background =
        "linear-gradient(to bottom,#021d38,#01111f,#000814)";

        depthText.innerHTML =
        `Depth: ${depthMeters}m 🌌<br>Deep Ocean`;

    }

    else {

        document.body.style.background =
        "linear-gradient(to bottom,#000814,#00030a,#000000)";

        depthText.innerHTML =
        `Depth: ${depthMeters}m 💎<br>Treasure Zone`;

    }
}

        function showReason() {
            reasonText.style.opacity = 0;
            setTimeout(() => {
                reasonText.innerHTML = reasons[currentReason];
                numberText.innerHTML = currentReason + 1;
                updateOceanDepth();
                reasonText.style.opacity = 1;
            }, 300);
        }

        // Start Button Handler
        document.getElementById("startBtn").addEventListener("click", () => {
            startAudio();
            switchView(heroView, reasonsView);
            currentReason = 0;
            showReason();
        });

        // Next Reason Button Handler
        if (nextBtn) {
            nextBtn.addEventListener("click", () => {
                oceanScene.classList.add("diving");
                setTimeout(() => oceanScene.classList.remove("diving"), 800);

                currentReason++;

                if (currentReason < reasons.length) {
                    showReason();
                } else {
                    switchView(reasonsView, endingView);
                    startTypewriter();
                }
            });
        }

        // Restart Button
        document.getElementById("restartBtn").addEventListener("click", () => {
            currentReason = 0;
            switchView(endingView, heroView);
        });

        // ------------------------------------------
        // TYPEWRITER EFFECT FOR ENDING
        // ------------------------------------------
        const typewriterEl = document.getElementById("typewriter");
        const endingText = 
`Dear Lucile,

Maybe one hundred reasons
will never be enough.

Because every day...
you give me another one.

You became my happiness.
My peace.
My favorite person.

💙 Forever Yours 💙`;

        function startTypewriter() {
            typewriterEl.innerHTML = "";
            let idx = 0;
            function typeChar() {
                if (idx < endingText.length) {
                    typewriterEl.innerHTML += endingText.charAt(idx);
                    idx++;
                    setTimeout(typeChar, 45);
                }
            }
            typeChar();
        }

        // ------------------------------------------
        // OCEAN LIFE GENERATORS (Fish, Bubbles, Hearts, Jelly)
        // ------------------------------------------
        
        // Shark Cursor Following
        const shark = document.getElementById("shark");
        if (shark) {
            let mouseX = window.innerWidth / 2;
            let mouseY = window.innerHeight / 2;
            let currentX = mouseX, currentY = mouseY;

            document.addEventListener("mousemove", (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;
            });

            function animateShark() {
                currentX += (mouseX - currentX) * 0.08;
                currentY += (mouseY - currentY) * 0.08;
                shark.style.left = currentX + "px";
                shark.style.top = currentY + "px";
                requestAnimationFrame(animateShark);
            }
            animateShark();
        }

        // Bubbles Generator
        const bubblesContainer = document.getElementById("bubbles");
        if (bubblesContainer) {
            function createBubble() {
                const bubble = document.createElement("div");
                bubble.className = "bubble";
                const size = 10 + Math.random() * 35;
                bubble.style.width = size + "px";
                bubble.style.height = size + "px";
                bubble.style.left = Math.random() * 100 + "vw";
                bubble.style.animationDuration = (6 + Math.random() * 7) + "s";
                bubblesContainer.appendChild(bubble);

                setTimeout(() => bubble.remove(), 13000);
            }
            setInterval(createBubble, 300);
            createBubble(); createBubble();
        }

        // Fish Generator
        const fishContainer = document.getElementById("fishContainer");
        if (fishContainer) {
            const fishes = ["🐠", "🐟", "🐡", "🐋"];
            function createFish() {
                const fish = document.createElement("div");
                fish.className = "fish";
                fish.innerHTML = fishes[Math.floor(Math.random() * fishes.length)];
                fish.style.fontSize = (50 + Math.random() * 50) + "px";
                fish.style.top = (10 + Math.random() * 75) + "vh";
                fish.style.right = "";
                fish.style.left = "";
                fish.style.transform = "";
const fromRight = Math.random() > 0.5;

fish.style.animationDuration = (10 + Math.random() * 8) + "s";

if (fromRight) {
    fish.style.left = "110%";
    fish.style.transform = "scaleX(-1)";
    fish.style.animationName = "fishSwimReverse";
} else {
    fish.style.left = "-150px";
    fish.style.transform = "scaleX(1)";
    fish.style.animationName = "fishSwim";
}
                fishContainer.appendChild(fish);

                setTimeout(() => fish.remove(), 20000);
            }
            setInterval(createFish, 2500);
            createFish();
        }

        // Jellyfish Generator
        const jellyContainer = document.getElementById("jellyContainer");
        if (jellyContainer) {
            function createJelly() {
                const jelly = document.createElement("div");
                jelly.className = "jelly";
                jelly.innerHTML = "ଳ";
                jelly.style.left = Math.random() * 100 + "vw";
                jelly.style.animationDuration = (15 + Math.random() * 10) + "s";
                jellyContainer.appendChild(jelly);

                setTimeout(() => jelly.remove(), 25000);
            }
            setInterval(createJelly, 4000);
        }

        // Floating Hearts Generator
        const heartsContainer = document.getElementById("hearts");
        if (heartsContainer) {
            function createHeart() {
                const heart = document.createElement("div");
                heart.className = "heart";
                heart.innerHTML = Math.random() > 0.5 ? "❤" : "💙";
                heart.style.left = Math.random() * 100 + "vw";
                heart.style.fontSize = (15 + Math.random() * 25) + "px";
                heart.style.animationDuration = (5 + Math.random() * 5) + "s";
                heartsContainer.appendChild(heart);

                setTimeout(() => heart.remove(), 10000);
            }
            setInterval(createHeart, 350);
        }
    </script>
</body>
</html>
